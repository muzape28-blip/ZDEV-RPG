name: android-build

# CI build APK arm32 (armeabi-v7a) untuk Infinix Smart 9 HD.
# Godot di-PIN ke versi tetap — jangan pernah "latest".
on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  export-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot (pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install export templates (pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          # Nama folder WAJIB format titik: 4.7.2.stable (bukan hyphen).
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          # Preventif: Godot butuh zipalign/apksigner dari build-tools.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 \
            || echo "sdkmanager tambahan gagal (mungkin sudah tersedia) — lanjut"

      - name: Generate debug keystore (ephemeral, tidak pernah di-commit)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare editor settings (SDK + keystore)
        run: |
          "$GODOT_BIN" --headless --editor --quit || true
          SETTINGS=$(ls "$HOME"/.config/godot/editor_settings-*.tres | head -n 1)
          echo "Patching: $SETTINGS"
          {
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
            echo "export/android/debug_keystore = \"${RUNNER_TEMP}/debug.keystore\""
            echo "export/android/shutdown_adb_on_exit = false"
          } >> "$SETTINGS"

      - name: PARSE-CHECK semua GDScript (gerbang permanen)
        run: |
          set -e
          for s in main player_controller camera_follow hud floating_joystick ui_button arena_spawner terrain_generator grass proxy_humanoid runtime_smoke; do
            echo "-- check $s"
            "$GODOT_BIN" --headless --path . --check-only --script "res://scripts/$s.gd"
          done
          echo "PARSE HIJAU"

      - name: BOOT-CHECK headless (gerbang permanen)
        run: |
          "$GODOT_BIN" --headless --path . --quit-after 30 > boot.log 2>&1 || true
          if grep -q "SCRIPT ERROR" boot.log; then
            echo "BOOT MERAH:"; grep -B2 -A2 "SCRIPT ERROR" boot.log; exit 1
          fi
          echo "BOOT HIJAU: 30 frame tanpa SCRIPT ERROR"

      - name: RUNTIME-SMOKE scene production
        run: |
          set -e
          cp project.godot "$RUNNER_TEMP/project.godot.original"
          restore_project() { cp "$RUNNER_TEMP/project.godot.original" project.godot; }
          trap restore_project EXIT
          printf '\n[autoload]\nRuntimeSmoke="*res://scripts/runtime_smoke.gd"\n' >> project.godot
          ZDEV_RUNTIME_SMOKE=1 "$GODOT_BIN" --headless --path . > smoke.log 2>&1
          if grep -qE "smoke FAIL|RUNTIME SMOKE: MERAH|SCRIPT ERROR|Parse Error" smoke.log; then
            echo "RUNTIME SMOKE MERAH:"; grep -E "smoke FAIL|RUNTIME SMOKE: MERAH|SCRIPT ERROR|Parse Error" smoke.log; exit 1
          fi
          grep -q "RUNTIME SMOKE: HIJAU" smoke.log
          echo "RUNTIME SMOKE HIJAU"

      - name: Export APK (debug, arm32)
        run: |
          mkdir -p export
          "$GODOT_BIN" --headless --path . --export-debug "Android" export/journey.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zdev-rpg-android-arm32
          path: export/journey.apk
          retention-days: 7
