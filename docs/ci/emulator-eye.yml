name: emulator-eye

# MATA AWAN: emulator Android x86 jalan di KVM runner GitHub (bukan sandbox),
# APK di-install, screencap diambil, PNG di-commit balik ke branch.
# Sandbox tinggal fetch + baca = visualisasi "native" tanpa dl.google lokal.
# Commit balik pakai [skip ci] biar tidak loop.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "shaders/**"
      - "export_presets.cfg"

jobs:
  build-and-eye:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot (pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install export templates (pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare editor settings
        run: |
          "$GODOT_BIN" --headless --editor --quit || true
          SETTINGS=$(ls "$HOME"/.config/godot/editor_settings-*.tres | head -n 1)
          {
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
            echo "export/android/debug_keystore = \"${RUNNER_TEMP}/debug.keystore\""
            echo "export/android/shutdown_adb_on_exit = false"
          } >> "$SETTINGS"

      - name: Export APK (arm32 + x86)
        run: |
          mkdir -p export
          "$GODOT_BIN" --headless --path . --export-debug "Android" export/journey.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + install + screencap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86
          disable-animations: true
          script: |
            adb install -r -t export/journey.apk
            adb shell monkey -p com.zdev.rpg -c android.intent.category.LAUNCHER 1
            sleep 25
            mkdir -p EYE
            adb shell screencap -p /sdcard/e1.png && adb pull /sdcard/e1.png EYE/e1.png
            sleep 8
            adb shell screencap -p /sdcard/e2.png && adb pull /sdcard/e2.png EYE/e2.png
            adb shell input swipe 300 400 300 250 300
            sleep 4
            adb shell screencap -p /sdcard/e3.png && adb pull /sdcard/e3.png EYE/e3.png

      - name: Commit screenshots back
        run: |
          git config user.name "arena-eye-bot"
          git config user.email "arena-eye@users.noreply.github.com"
          git add EYE/ || true
          git diff --cached --quiet || { git commit -m "eye: native screenshots [skip ci]"; git push; }
